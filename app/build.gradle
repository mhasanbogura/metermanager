apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

repositories {
    google()
    mavenCentral()
}

def versionPropsFile = file('version.properties')
def props = new Properties()
if (versionPropsFile.exists()) {
    props.load(new FileInputStream(versionPropsFile))
}
def vc = (props.getProperty('versionCode', '3') as int)
def vn = props.getProperty('versionName', '1')
def vnParts = vn.split('\\.')
def major = vnParts.length > 0 ? vnParts[0] as int : 1
def minor = vnParts.length > 1 ? vnParts[1] as int : 0
def patch = vnParts.length > 2 ? vnParts[2] as int : 0
patch += 1
if (patch > 99) { patch = 0; minor += 1 }
if (minor > 99) { minor = 0; major += 1 }
def newVn = "${major}.${minor}.${patch}"
def newVc = vc + 3

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
// Where the finished APK is copied to (the store folder)
def storeDist = isWindows
    ? 'C:/Google Drive/mahmudulhasandhk70/App Store/Android'
    : '/home/mhasanbogura/Google Drive/mahmudulhasandhk70/App Store/Android'
// GitHub CLI binary
def ghBin = isWindows
    ? "${System.getProperty('user.home')}/.tools/bin/gh"
    : '/home/mhasanbogura/gh-cli/bin/gh'

// ---------------------------------------------------------------------------
// Pinned signing key
// Every APK is signed with this one keystore, kept inside the project (synced
// through Google Drive) so the signing identity is the same on every machine.
// It is the same debug key that signs the App Store app.
// The build refuses to run if the file is missing or if its certificate is not
// the pinned one, so the key can never silently change again.
// NOTE: this replaced the original Linux ~/.android/debug.keystore key on
// 2026-10-26 (that file was unreachable), so apps signed with the old key must
// be uninstalled once before installing builds signed with this one.
// ---------------------------------------------------------------------------
def pinnedKeystore = file("${rootDir}/keystore/debug.keystore")
def pinnedFingerprint = '2739ef853f3cf1a1e2eec1378a51971186e654f508f62a774a654adec0caf59d'
def pinnedAlias = 'androiddebugkey'
def pinnedPassword = 'android'

def keystoreFingerprint = { File keystore ->
    def ks = java.security.KeyStore.getInstance('JKS')
    keystore.withInputStream { ks.load(it, pinnedPassword.toCharArray()) }
    def cert = ks.getCertificate(pinnedAlias)
    java.security.MessageDigest.getInstance('SHA-256')
        .digest(cert.encoded).encodeHex().toString()
}

android {
    namespace 'com.mahmuduls.metermanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.mahmuduls.metermanager"
        minSdk 24
        targetSdk 34
        versionCode newVc
        versionName newVn
    }

    signingConfigs {
        pinned {
            if (!pinnedKeystore.exists()) {
                throw new GradleException(
                    "Pinned signing keystore is missing:\n" +
                    "  ${pinnedKeystore}\n" +
                    "Restore it from 'C:\\Google Drive\\mahmudulhasandhk70\\OpenCode\\App Store\\debug.keystore'.\n" +
                    "Every build must use that key - never generate a new one.")
            }
            def actual = keystoreFingerprint(pinnedKeystore)
            if (actual != pinnedFingerprint) {
                throw new GradleException(
                    "The keystore at ${pinnedKeystore} is not the pinned signing key.\n" +
                    "  expected SHA-256: ${pinnedFingerprint}\n" +
                    "  found    SHA-256: ${actual}\n" +
                    "Refusing to build with a different signing identity.")
            }
            storeFile pinnedKeystore
            storePassword pinnedPassword
            keyAlias pinnedAlias
            keyPassword pinnedPassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pinned
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pinned
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.browser:browser:1.6.0'
    implementation 'com.google.firebase:firebase-auth:22.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}

task updateVersionProperties {
    doLast {
        props.setProperty('versionCode', newVc.toString())
        props.setProperty('versionName', newVn)
        props.store(new FileOutputStream(versionPropsFile), null)
    }
}

task updateWebVersion {
    doLast {
        def webJsFile = file("../js/app.js")
        if (webJsFile.exists()) {
            def content = webJsFile.text
            content = content.replaceAll("'[0-9]+\\.[0-9]+\\.[0-9]+'", "'" + newVn + "'")
            content = content.replaceAll("'[0-9]+'\\}\\)", "'" + newVc + "'})")
            webJsFile.text = content
            println "Updated web version to Version ${newVn} (build ${newVc})"
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('assemble')) {
        task.dependsOn updateVersionProperties
        task.dependsOn updateWebVersion
    }
}

def deployTo = { File dist ->
    if (!dist.exists()) dist.mkdirs()
    def pattern = ~/Meter Manager_com\.mahmuduls\.metermanager_v.*\.apk/
    dist.listFiles().findAll { it.isFile() && pattern.matcher(it.name).matches() }.each { it.delete() }
    copy {
        from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
        into dist
        rename { "Meter Manager_com.mahmuduls.metermanager_v${newVn}_build_${newVc}.apk" }
    }
    println "Deployed Meter Manager_com.mahmuduls.metermanager_v${newVn}_build_${newVc}.apk to ${dist}"
}

task deployApk(dependsOn: 'assembleDebug') {
    doLast {
        deployTo(file(storeDist))
    }
}

task uploadToGitHub {
    doLast {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain'
            workingDir = file('..')
            standardOutput = out
            ignoreExitValue true
        }
        if (!out.toString().trim()) {
            println 'GitHub: nothing to upload'
            return
        }
        exec { commandLine 'git', 'add', '-A'; workingDir = file('..') }
        exec {
            commandLine 'git', 'commit', '-m', "Meter Manager v${newVn} (build ${newVc})"
            workingDir = file('..')
            ignoreExitValue true
        }
        exec { commandLine 'git', 'push', 'origin', 'main'; workingDir = file('..') }
        println "GitHub: pushed (v${newVn} build ${newVc})"

        def tagName = "v${newVn}"
        exec {
            commandLine 'git', 'tag', '-d', tagName
            workingDir = file('..')
            ignoreExitValue true
        }
        exec {
            commandLine 'git', 'push', 'origin', ':refs/tags/' + tagName
            workingDir = file('..')
            ignoreExitValue true
        }
        exec {
            commandLine 'git', 'tag', tagName
            workingDir = file('..')
        }
        exec {
            commandLine 'git', 'push', 'origin', tagName
            workingDir = file('..')
        }
        println "GitHub: tagged ${tagName}"

        def apkFile = "Meter Manager_com.mahmuduls.metermanager_v${newVn}_build_${newVc}.apk"
        def apkPath = new File(storeDist, apkFile)
        def tmpApk = new File(layout.buildDirectory.get().asFile, 'MeterManager.apk')
        exec {
            commandLine ghBin, 'release', 'delete', tagName, '--yes'
            workingDir = file('..')
            ignoreExitValue true
        }
        if (apkPath.exists()) {
            copy {
                from apkPath
                into tmpApk.parentFile
                rename { tmpApk.name }
            }
            exec {
                commandLine ghBin, 'release', 'create', tagName, tmpApk.absolutePath,
                    '--title', "Meter Manager v${newVn} (build ${newVc})",
                    '--notes', "Meter Manager v${newVn} build ${newVc}",
                    '--latest'
                workingDir = file('..')
            }
            tmpApk.delete()
            println "GitHub: released ${tagName} with MeterManager.apk (from ${apkFile})"
        } else {
            exec {
                commandLine ghBin, 'release', 'create', tagName,
                    '--title', "Meter Manager v${newVn} (build ${newVc})",
                    '--notes', "Meter Manager v${newVn} build ${newVc}",
                    '--latest'
                workingDir = file('..')
            }
            println "GitHub: released ${tagName} (no APK attached)"
        }
    }
}

afterEvaluate {
    assembleDebug.finalizedBy deployApk
    deployApk.finalizedBy uploadToGitHub
    // Run with -PskipGitHub to build and deploy the APK only (no commit, push or release)
    uploadToGitHub.onlyIf { !project.hasProperty('skipGitHub') }
}
